<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>XU4 Legacy Edition</title>
<meta name="description" content="Ultima IV recreated, with gamepad, touch and console style menus. Plays your own copy of the DOS game.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="XU4 Legacy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #000; --panel: #0a0a2a; --edge: #3a5ad0; --text: #e8e8f0; --dim: #9aa0c0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 16px/1.45 system-ui, sans-serif; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; background: #000; outline: none; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             padding: 16px; background: rgba(0,0,0,.85); z-index: 10; }
  .overlay[hidden] { display: none; }
  .box { max-width: 30rem; width: 100%; background: var(--panel); border: 2px solid var(--edge);
         border-radius: 8px; padding: 20px; box-sizing: border-box; }
  .box h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  .box p, .box li { margin: .5rem 0; color: var(--dim); }
  .box ul { margin: .5rem 0; padding-left: 1.2rem; }
  #stored table { width: 100%; border-collapse: collapse; margin: .25rem 0 .5rem; }
  #stored td { padding: .3rem 0; border-top: 1px solid #2a3570; color: var(--text); vertical-align: middle; }
  #stored td.files { color: var(--dim); font-size: .85rem; overflow-wrap: anywhere; }
  #stored td:last-child { text-align: right; }
  #stored button { margin: 0; padding: .3rem .7rem; font-size: .85rem; }
  #stored h2 { font-size: 1rem; margin: .75rem 0 0; }
  .box { max-height: calc(100% - 32px); overflow-y: auto; }
  .box code { color: var(--text); }
  button, label.button { display: inline-block; margin: .5rem .5rem 0 0; padding: .55rem 1.1rem;
           font: inherit; font-weight: 600; color: #fff; background: #2a4aa0; border: 0;
           border-radius: 6px; cursor: pointer; }
  button.quiet { background: #333a5a; }
  input[type=file] { display: none; }
  #menuButton { position: fixed; top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
                margin: 6px; padding: 4px 10px; background: rgba(40,60,150,.8); z-index: 5; }
  #status { min-height: 1.4em; }
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: block; color: #fc6; }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<button id="menuButton" hidden aria-label="Files and saves">Files</button>

<div class="overlay" id="startBox">
  <div class="box">
    <h1>XU4 Legacy Edition</h1>
    <p>Ultima IV recreated, with gamepad, touch and console style menus. It plays your own copy of
       the DOS game (from GOG, or <code>ultima4.zip</code>); your files and saved games stay in this
       browser.</p>
    <p id="rotate">Turn your device sideways to play.</p>
    <p id="status">Loading...</p>
    <button id="playButton" disabled>Play</button>
    <button class="quiet" id="startFiles" disabled>Game Files</button>
  </div>
</div>

<div class="overlay" id="filesBox" hidden>
  <div class="box">
    <h1 id="filesTitle">Game files</h1>
    <div id="filesText"></div>
    <div id="stored"></div>
    <label class="button" for="fileInput">Choose Files</label>
    <label class="button" for="folderInput" id="folderButton">Choose Folder</label>
    <button id="restartButton" hidden>Restart</button>
    <button class="quiet" id="exportButton">Export Saves</button>
    <button class="quiet" id="closeFiles">Close</button>
    <input type="file" id="fileInput" multiple>
    <input type="file" id="folderInput" webkitdirectory>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const DATA = '/xu4';
let syncing = false, needSync = false, pendingChoose = null;

// Write the files in DATA back to IndexedDB.
function syncSave() {
  if (syncing) { needSync = true; return; }
  syncing = true;
  FS.syncfs(false, (err) => {
    syncing = false;
    if (err) console.warn('xu4: saving to IndexedDB failed', err);
    if (needSync) { needSync = false; syncSave(); }
  });
}

const INTRO = '<p>XU4 needs the files of Ultima IV for DOS.</p><ul>' +
  '<li><b>From GOG</b> you get an installer (<code>setup_ultima_iv_...exe</code>), which cannot run ' +
  'in a browser. Install it on a Windows PC, then use Choose Folder and pick the folder it made ' +
  '(<code>C:\\GOG Games\\Ultima 4 - Quest of the Avatar</code>), or Choose Files and select all ' +
  'the files in it. For an iPhone or iPad, zip that folder and put the zip in iCloud Drive or ' +
  'Files, then choose the zip. On a Mac or Linux, <code>innoextract</code> unpacks the installer.</li>' +
  '<li>Or choose <code>ultima4.zip</code> if you have it.</li></ul>' +
  '<p>Also, now or later from Game Files: <code>u4upgrad.zip</code> (the VGA upgrade), Apple II ' +
  '(<code>.dsk</code>) or C64 (<code>.d64</code>, <code>.d81</code>) disk images and the Sega ' +
  'Master System ROM (<code>.sms</code>), on their own or in zip files.</p>';
const LATER = '<p>Add more files at any time: <code>u4upgrad.zip</code> (the VGA upgrade), Apple II ' +
  '(<code>.dsk</code>) or C64 (<code>.d64</code>, <code>.d81</code>) disk images and the Sega ' +
  'Master System ROM (<code>.sms</code>), on their own or in zip files. Export Saves downloads ' +
  'your settings and saved games as a zip.</p>';

// iOS has no folder picker; selecting the files (or a zip) works there.
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (IOS || !('webkitdirectory' in $('folderInput'))) $('folderButton').hidden = true;

let running = false;
// The game files saved in this browser, in groups that can be removed.
function storedGroups() {
  const ls = (dir) => { try { return FS.readdir(dir).filter((n) => n !== '.' && n !== '..'); }
                        catch (e) { return []; } };
  const groups = [
    { label: 'Ultima IV for DOS', files: [] },
    { label: 'Documents', files: [] },
    { label: 'VGA upgrade', files: [] },
    { label: 'Disk images & ROMs', files: [] },
  ];
  for (const n of ls(DATA + '/u4')) {
    if (DOC_FILE.test(n)) groups[1].files.push('u4/' + n);
    else groups[0].files.push('u4/' + n);
  }
  for (const n of ls(DATA + '/docs')) groups[1].files.push('docs/' + n);
  for (const n of ls(DATA)) {
    if (/^u4upgrad\.zip$/i.test(n)) groups[2].files.push(n);
    else if (/\.zip$/i.test(n)) groups[0].files.push(n);   // ultima4.zip
    else if (IMAGE_FILE.test(n)) groups[3].files.push(n);
  }
  return groups.filter((g) => g.files.length);
}

function showStored() {
  const groups = storedGroups();
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  let html = '<h2>In this browser</h2>';
  if (!groups.length) html += '<p>No game files yet.</p>';
  else {
    html += '<table>';
    groups.forEach((g, i) => {
      const names = g.files.map((f) => f.replace(/^(u4|docs)\//, ''));
      const list = names.length > 6 ? names.length + ' files' : names.join(', ');
      html += '<tr><td>' + g.label + '</td><td class="files">' + esc(list) + '</td>' +
              '<td><button class="quiet" data-group="' + i + '">Remove</button></td></tr>';
    });
    html += '</table>';
  }
  $('stored').innerHTML = html;
  for (const b of $('stored').querySelectorAll('button')) {
    b.onclick = () => {
      const g = groups[+b.dataset.group];
      if (!confirm('Remove ' + g.label + ' from this browser? Saved games are kept.')) return;
      for (const f of g.files) { try { FS.unlink(DATA + '/' + f); } catch (e) {} }
      FS.syncfs(false, () => {
        showFiles('<p>Removed ' + g.label + '.' + (running ? ' Restart to stop using them.' : '') +
                  '</p>' + LATER, true, running);
      });
    };
  }
}

function showFiles(text, canClose, restart) {
  $('filesText').innerHTML = text;
  if (canClose) showStored(); else $('stored').innerHTML = '';
  $('closeFiles').hidden = !canClose;
  $('exportButton').hidden = !canClose;
  $('restartButton').hidden = !restart;
  $('filesBox').hidden = false;
}

// The DOS game's files, which go in DATA/u4 (kept apart from the saves).
const DOS_FILE = /^(avatar\.exe|title\.exe|.*\.(cga|com|con|dng|drv|ega|egz|map|new|old|pal|pic|tlk|ult))$/i;
// Other platforms' data, which the modules look for in DATA.
const IMAGE_FILE = /\.(dsk|do|d64|d81|sms)$/i;
// The printed documents (ULTIMA4.TXT from GOG, or separate files), which go
// with the DOS files.
const DOC_FILE = /^(ultima4|history|wisdom|hints|keyboard)\.txt$/i;
const baseName = (path) => path.slice(path.lastIndexOf('/') + 1);

// List the entries of a zip archive.
function zipEntries(buf) {
  const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let end = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); --i) {
    if (v.getUint32(i, true) === 0x06054b50) { end = i; break; }
  }
  if (end < 0) return null;
  const dec = new TextDecoder();
  const list = [];
  let p = v.getUint32(end + 16, true);
  for (let n = v.getUint16(end + 10, true); n > 0 && p + 46 <= buf.length; --n) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const nlen = v.getUint16(p + 28, true);
    list.push({
      name: dec.decode(buf.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/'),
      method: v.getUint16(p + 10, true),
      csize: v.getUint32(p + 20, true),
      offset: v.getUint32(p + 42, true),
    });
    p += 46 + nlen + v.getUint16(p + 30, true) + v.getUint16(p + 32, true);
  }
  return list;
}

async function zipRead(buf, e) {
  const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const start = e.offset + 30 + v.getUint16(e.offset + 26, true) + v.getUint16(e.offset + 28, true);
  const data = buf.subarray(start, start + e.csize);
  if (e.method === 0) return data;
  if (e.method !== 8) throw new Error('unsupported zip method ' + e.method);
  const out = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(out).arrayBuffer());
}

function mkdirs(path) {
  let dir = '';
  for (const part of path.split('/').slice(1, -1)) {
    dir += '/' + part;
    try { FS.mkdir(dir); } catch (e) { /* exists */ }
  }
}
function saveFile(path, data) { mkdirs(path); FS.writeFile(path, data); }

// Save what the player chose: the DOS game's files (loose, from a folder or
// in a zip such as ultima4.zip), the VGA upgrade zip, and disk images & ROMs
// (loose or zipped).  Returns what was found.
async function saveChosen(files) {
  const got = { dos: 0, avatar: false, upgrade: false, docs: false, images: [], installer: false };
  const saveDos = (name, data) => {
    saveFile(DATA + '/u4/' + name.toUpperCase(), data);
    ++got.dos;
    if (/^avatar\.exe$/i.test(name)) got.avatar = true;
  };
  for (const f of files) {
    const name = f.name;
    if (DOS_FILE.test(name)) {
      saveDos(name, new Uint8Array(await f.arrayBuffer()));
    } else if (DOC_FILE.test(name)) {
      saveFile(DATA + '/u4/' + name, new Uint8Array(await f.arrayBuffer()));
      got.docs = true;
    } else if (IMAGE_FILE.test(name)) {
      saveFile(DATA + '/' + name, new Uint8Array(await f.arrayBuffer()));
      got.images.push(name);
    } else if (/^setup.*\.exe$/i.test(name)) {
      got.installer = true;
    } else if (/\.zip$/i.test(name)) {
      const buf = new Uint8Array(await f.arrayBuffer());
      const list = zipEntries(buf);
      if (!list) continue;
      if (list.some((e) => /^u4vga\.pal$/i.test(baseName(e.name)))) {
        // xu4 reads the upgrade from its zip.
        saveFile(DATA + '/u4upgrad.zip', buf);
        got.upgrade = true;
        continue;
      }
      const exe = list.find((e) => /^avatar\.exe$/i.test(baseName(e.name)));
      const dir = exe ? exe.name.slice(0, exe.name.length - 10) : null;
      for (const e of list) {
        const base = baseName(e.name);
        if (exe && e.name === dir + base && DOS_FILE.test(base))
          saveDos(base, await zipRead(buf, e));
        else if (DOC_FILE.test(base)) {
          saveFile(DATA + '/u4/' + base, await zipRead(buf, e));
          got.docs = true;
        }
        else if (IMAGE_FILE.test(base)) {
          saveFile(DATA + '/' + base, await zipRead(buf, e));
          got.images.push(base);
        }
      }
    }
  }
  await new Promise((done) => FS.syncfs(false, () => done()));
  return got;
}

function describe(got) {
  const parts = [];
  if (got.avatar) parts.push('the Ultima IV for DOS files');
  else if (got.dos) parts.push(got.dos + ' Ultima IV file(s)');
  if (got.docs) parts.push('the documents');
  if (got.upgrade) parts.push('the VGA upgrade');
  if (got.images.length) parts.push(got.images.join(', '));
  let text = parts.length ? '<p>Added ' + parts.join(', ') + '.</p>' : '<p>Nothing XU4 uses was found in the chosen files.</p>';
  if (got.installer)
    text += '<p>The GOG installer cannot run in a browser: install it on a PC and choose the ' +
            'files it installed (see below).</p>';
  return text;
}

async function chosen(files) {
  if (!files.length) return;
  const got = await saveChosen(files);
  if (pendingChoose) {
    // The game is waiting for the DOS files; it checks again & asks again
    // if they are still missing.
    const resolve = pendingChoose;
    pendingChoose = null;
    lastChosen = got;
    $('filesBox').hidden = true;
    resolve(got.dos + got.images.length + (got.upgrade ? 1 : 0));
  } else if (running) {
    showFiles(describe(got) + '<p>The game reads new files when it starts: save your game, then ' +
              'Restart.</p>' + LATER, true, true);
  } else {
    showFiles(describe(got) + LATER, true);
  }
}
let lastChosen = null;
for (const id of ['fileInput', 'folderInput']) {
  $(id).addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    chosen(files);
  });
}
// SDL's fill-document window moves everything else on the page into a
// hidden element; bring back the Files button & box.
new MutationObserver(() => {
  if (document.getElementById('SDL3_fill_document_background_elements'))
    for (const id of ['menuButton', 'filesBox'])
      if ($(id).parentNode !== document.body) document.body.appendChild($(id));
}).observe(document.body, { childList: true });
$('restartButton').onclick = () => {
  FS.syncfs(false, () => location.reload());
};
$('closeFiles').onclick = () => { $('filesBox').hidden = true; };
$('menuButton').onclick = () => showFiles(LATER, true);
$('startFiles').onclick = () => showFiles(INTRO + '<p>Export Saves downloads your settings and ' +
  'saved games as a zip.</p>', true);

// A zip archive (stored, not compressed) of every file under DATA.
function crc32(buf) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; ++i) {
    c = (crc ^ buf[i]) & 0xFF;
    for (let k = 0; k < 8; ++k) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipFiles(entries) {
  const parts = [], dir = [];
  let offset = 0;
  const enc = new TextEncoder();
  for (const [name, data] of entries) {
    const nm = enc.encode(name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true);
    h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(h, nm, data);
    const d = new DataView(new ArrayBuffer(46));
    d.setUint32(0, 0x02014b50, true); d.setUint16(4, 20, true); d.setUint16(6, 20, true);
    d.setUint32(16, crc, true); d.setUint32(20, data.length, true);
    d.setUint32(24, data.length, true); d.setUint16(28, nm.length, true);
    d.setUint32(42, offset, true);
    dir.push(d, nm);
    offset += 30 + nm.length + data.length;
  }
  const size = dir.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true); end.setUint32(12, size, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...dir, end], { type: 'application/zip' });
}
function listFiles(path, prefix, out) {
  for (const name of FS.readdir(path)) {
    if (name === '.' || name === '..') continue;
    const full = path + '/' + name, st = FS.stat(full);
    if (FS.isDir(st.mode)) {
      if (!(prefix === '' && name === 'u4')) listFiles(full, prefix + name + '/', out);
    }
    else if (!/\.(zip|dsk|do|d64|d81|sms)$/i.test(name))   // Not the game data.
      out.push([prefix + name, FS.readFile(full)]);
  }
  return out;
}
$('exportButton').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipFiles(listFiles(DATA, '', [])));
  a.download = 'xu4-saves-' + new Date().toISOString().slice(0, 10) + '.zip';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};

var Module = {
  canvas: $('canvas'),
  noInitialRun: true,
  preRun: [() => {
    FS.mkdir(DATA);
    FS.mount(IDBFS, {}, DATA);
    addRunDependency('xu4-idbfs');
    FS.syncfs(true, (err) => {
      if (err) console.warn('xu4: reading IndexedDB failed', err);
      removeRunDependency('xu4-idbfs');
    });
  }],
  onRuntimeInitialized: () => {
    $('status').textContent = '';
    $('playButton').disabled = false;
    $('startFiles').disabled = false;
  },
  setStatus: (text) => { if (text) $('status').textContent = text; },
  print: (text) => console.log(text),
  printErr: (text) => console.warn(text),
  // Called by the game (src/web.cpp) when ultima4.zip is missing.
  xu4ChooseFiles: (retry) => new Promise((resolve) => {
    pendingChoose = resolve;
    showFiles(retry ? describe(lastChosen || { dos: 0, images: [] }) +
              '<p>The Ultima IV for DOS files are still missing.</p>' + INTRO : INTRO, false);
  }),
};

$('playButton').onclick = () => {
  $('startBox').hidden = true;
  running = true;
  $('menuButton').hidden = false;
  $('canvas').focus();
  // Keep saves: write back every few seconds and when the page is hidden.
  setInterval(syncSave, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) syncSave(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  Module.callMain([]);
};

if ('serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js');
</script>
{{{ SCRIPT }}}
</body>
</html>
