# Build the Windows, macOS, Linux & Android packages (and a Linux Flatpak bundle) and publish
# them as a GitHub release, either when a legacy-* tag is pushed or when run
# from the Actions tab with a release tag (the tag is then created on the
# commit that was built, or the files are replaced and the tag moved if that
# release already exists).

name: Release

on:
  push:
    tags: ['legacy-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. legacy-1.1 (leave empty to only build)'
        required: false

permissions:
  contents: write
  actions: write    # to start the Flatpak repository update

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      matrix:
        target: [windows, linux]
    # Ubuntu 22.04 keeps the Linux binary compatible with older systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: ${{ matrix.target == 'linux' }}

      - name: Install tools
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.target }}" = windows ]; then
            sudo apt-get install -y -q mingw-w64 cmake zip
          else
            sudo apt-get install -y -q cmake ninja-build \
              zlib1g-dev libgl1-mesa-dev libegl1-mesa-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
              libxss-dev libxfixes-dev libxtst-dev libwayland-dev \
              libxkbcommon-dev libdecor-0-dev libpulse-dev libasound2-dev \
              libudev-dev libdbus-1-dev libdrm-dev libgbm-dev
          fi
          git clone -q --depth 1 -b v2.0.8 https://github.com/0branch/boron /tmp/boron
          (cd /tmp/boron && ./configure --static && make -j4)
          sudo cp /tmp/boron/boron /usr/local/bin

      - name: Build
        run: |
          make render.pak Ultima-IV.mod U4-Upgrade.mod Apple-II.mod Apple-II-Music.mod \
            C64.mod C64-Music.mod C64-Remastered.mod SMS.mod SMS-Music.mod
          VERSION=${TAG#legacy-}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          dist/build-${{ matrix.target }}.sh "$VERSION"
          mkdir out
          cp build-win/*.zip build-linux/*.tar.gz build-linux/*.deb out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-${{ matrix.target }}
          path: out/*

  flatpak:
    # Ubuntu 24.04 has a flatpak-builder that can run appstreamcli compose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          # Let bubblewrap create its sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: |
          VERSION=${TAG#legacy-}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always | sed 's/^legacy-//')
          dist/build-flatpak.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-flatpak
          path: build-flatpak/*.flatpak

  macos:
    # A universal (Apple Silicon & Intel) app in a disk image.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          VERSION=${TAG#legacy-}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          dist/build-macos.sh "$VERSION"
          # The app must at least start (--help exits before the window).
          "build-mac/dmg/XU4 Legacy.app/Contents/MacOS/xu4" --help
      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-macos
          path: build-mac/*.dmg
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          XU4_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          git clone -q --depth 1 -b v2.0.8 https://github.com/0branch/boron /tmp/boron
          (cd /tmp/boron && ./configure --static && make -j4)
          sudo cp /tmp/boron/boron /usr/local/bin
          # The release key (android/README.md); without it the APK gets a
          # throwaway debug key and will not install over other builds.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xu4.keystore"
            export XU4_KEYSTORE="$RUNNER_TEMP/xu4.keystore"
          fi
          VERSION=${TAG#legacy-}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          dist/build-android.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-android
          path: build-android/*.apk
  publish:
    needs: [build, flatpak, macos, android]
    if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rebuild from the Actions tab moves the tag to the built commit.
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                -f sha="$GITHUB_SHA" -F force=true
            fi
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            # Only tags like legacy-1.1-pre1 or legacy-1.1-rc1 are pre-releases.
            case "$TAG" in
              *-pre*|*-rc*|*-beta*) PRE=--prerelease ;;
              *) PRE=--latest ;;
            esac
            gh release create "$TAG" out/* --target "$GITHUB_SHA" \
              --title "XU4 Legacy Edition ${TAG#legacy-}" \
              --notes-file dist/release-notes.md $PRE
          fi
          # Serve the new Flatpak from the repository on GitHub Pages, so
          # installed copies update (pre-releases are not served).
          case "$TAG" in
            *-pre*|*-rc*|*-beta*) ;;
            *) gh workflow run flatpak-repo.yml --ref "${{ github.event.repository.default_branch }}" ;;
          esac
