# Build the Windows package and publish it as a GitHub release when a
# version tag is pushed (or when run by hand from the Actions tab).

name: Release

on:
  push:
    tags: ['legacy-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 cmake zip
          curl -sSfL -o /usr/local/bin/boron \
            https://urlan.sourceforge.net/boron/static/boron-2.1.0-Linux.x86_64 \
            || sudo curl -sSfL -o /usr/local/bin/boron \
            https://urlan.sourceforge.net/boron/static/boron-2.1.0-Linux.x86_64
          sudo chmod +x /usr/local/bin/boron

      - name: Build
        run: |
          make render.pak Ultima-IV.mod U4-Upgrade.mod
          VERSION=${GITHUB_REF_NAME#legacy-}
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION=$(git describe --tags --always)
          dist/build-windows.sh "$VERSION" | tail -1 > zip-path

      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-windows
          path: build-win/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$(cat zip-path)" \
            --title "XU4 Legacy Edition ${GITHUB_REF_NAME#legacy-}" \
            --notes-file dist/release-notes.md --prerelease
