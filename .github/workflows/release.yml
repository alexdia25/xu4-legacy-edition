# Build the Windows package and publish it as a GitHub release, either
# when a legacy-* tag is pushed or when run from the Actions tab with a
# release name (the tag is then created on the commit that was built).

name: Release

on:
  push:
    tags: ['legacy-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. legacy-1.1 (leave empty to only build)'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 cmake zip
          git clone -q --depth 1 -b v2.0.8 https://github.com/0branch/boron /tmp/boron
          (cd /tmp/boron && ./configure --static && make -j4)
          sudo cp /tmp/boron/boron /usr/local/bin

      - name: Build
        run: |
          make render.pak Ultima-IV.mod U4-Upgrade.mod
          TAG=${{ inputs.tag }}
          [ "$GITHUB_REF_TYPE" = tag ] && TAG=$GITHUB_REF_NAME
          echo "TAG=$TAG" >> $GITHUB_ENV
          VERSION=${TAG#legacy-}
          [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          dist/build-windows.sh "$VERSION" | tail -1 > zip-path

      - uses: actions/upload-artifact@v4
        with:
          name: xu4-legacy-windows
          path: build-win/*.zip

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$(cat zip-path)" --target "$GITHUB_SHA" \
            --title "XU4 Legacy Edition ${TAG#legacy-}" \
            --notes-file dist/release-notes.md --prerelease
